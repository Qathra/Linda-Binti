<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linda Binti · USSD</title>
  <style>
    :root { color-scheme: light; --ink:#14231c; --teal:#0f6b5c; --bg:#e8efe9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 420px; margin: 24px auto; padding: 0 16px 40px; }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    .lede { margin: 0 0 18px; color: #3d5248; font-size: 0.95rem; }
    .phone { background: #111; border-radius: 28px; padding: 18px 14px 22px; color: #d7ffe8; }
    .screen { background: #06281f; min-height: 220px; border-radius: 12px; padding: 14px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 0.92rem; line-height: 1.4; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    input, button { font: inherit; border-radius: 8px; border: 0; padding: 10px 12px; }
    input { flex: 1; }
    button { background: #19a37a; color: #06281f; font-weight: 700; cursor: pointer; }
    button.ghost { background: #2a3d36; color: #d7ffe8; }
    a { color: var(--teal); }
    .ok { margin-top: 12px; color: #0f6b5c; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Linda Binti USSD simulation</h1>
    <p class="lede">This is a browser demo of a planned feature-phone menu. It is not a live Safaricom shortcode. Flow: 1 GBV or 2 FGM → area → name → Send. The NGO map can flag a simulated report.</p>
    <div class="phone">
      <div class="screen" id="screen">Dial *384*1102# then Send</div>
      <div class="row">
        <input id="reply" placeholder="Type 1, 2, area, or your name" autocomplete="off">
        <button id="send" type="button">Send</button>
      </div>
      <div class="row">
        <button class="ghost" id="dial" type="button">Dial *384*1102#</button>
        <button class="ghost" id="reset" type="button">Hang up</button>
      </div>
    </div>
    <p class="ok" id="status"></p>
    <p><a href="/dashboard/">Open NGO case map</a></p>
  </div>
  <script>
    const screen = document.getElementById("screen");
    const reply = document.getElementById("reply");
    const status = document.getElementById("status");
    let sessionId = "";
    let text = "";
    let ended = true;

    function newSession() {
      sessionId = "ussd-" + Date.now();
      text = "";
      ended = false;
      status.textContent = "";
    }

    async function send(next) {
      if (!sessionId || ended) newSession();
      if (next) text = text ? (text + "*" + next) : next;
      const res = await fetch("/v1/ussd/demo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, text, serviceCode: "*384*1102#", msisdn: "" })
      });
      const body = await res.json();
      screen.textContent = body.message || "No response";
      ended = !!body.endSession;
      if (body.reportAccepted) {
        status.textContent = "Sent. Open the dashboard — AI will flag the area automatically.";
      }
      reply.value = "";
      reply.focus();
    }

    document.getElementById("dial").onclick = () => { newSession(); send(""); };
    document.getElementById("reset").onclick = () => {
      sessionId = "";
      text = "";
      ended = true;
      screen.textContent = "Dial *384*1102# then Send";
      status.textContent = "";
    };
    document.getElementById("send").onclick = () => send(reply.value.trim());
    reply.addEventListener("keydown", (e) => { if (e.key === "Enter") send(reply.value.trim()); });
  </script>
</body>
</html>
